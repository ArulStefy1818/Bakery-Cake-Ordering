<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Stackly Bakery - Page Not Found"
    >

    <title>404 | Stackly Bakery</title>

    <!-- =====================================================
         GOOGLE FONT
    ====================================================== -->
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="404.css">

</head>


<body>


    <!-- =====================================================
         404 PAGE
    ====================================================== -->

    <main class="stackly-404-page">


        <!-- Background Circles -->

        <div
            class="stackly-404-bg-circle stackly-404-circle-one"
            aria-hidden="true"
        ></div>

        <div
            class="stackly-404-bg-circle stackly-404-circle-two"
            aria-hidden="true"
        ></div>

        <div
            class="stackly-404-bg-circle stackly-404-circle-three"
            aria-hidden="true"
        ></div>


        <!-- Floating Bakery Icons -->

        <i
            class="fa-solid fa-bread-slice stackly-404-icon stackly-404-icon-one"
            aria-hidden="true"
        ></i>

        <i
            class="fa-solid fa-cookie-bite stackly-404-icon stackly-404-icon-two"
            aria-hidden="true"
        ></i>

        <i
            class="fa-solid fa-cake-candles stackly-404-icon stackly-404-icon-three"
            aria-hidden="true"
        ></i>

        <i
            class="fa-solid fa-mug-hot stackly-404-icon stackly-404-icon-four"
            aria-hidden="true"
        ></i>


        <!-- =================================================
             CONTENT
        ================================================== -->

        <section
            class="stackly-404-content"
            aria-labelledby="stackly-404-heading"
        >


            <!-- 404 -->

            <div class="stackly-404-number">

                404

                <span
                    class="stackly-404-dot"
                    aria-hidden="true"
                ></span>

            </div>


            <!-- Heading -->

            <h1
                id="stackly-404-heading"
                class="stackly-404-title"
            >
                Oops! This Page Is
                <span>Fresh Out</span>
            </h1>


            <!-- Description -->

            <p class="stackly-404-description">

                Looks like this page has disappeared from our bakery.
                Don't worry — there are plenty of delicious things
                waiting for you at Stackly Bakery.

            </p>


            <!-- Buttons -->

            <div class="stackly-404-buttons">


                <!-- Go Home -->

                <a
                    href="admin.html"
                    class="stackly-404-button stackly-404-home"
                >

                    <i
                        class="fa-solid fa-house"
                        aria-hidden="true"
                    ></i>

                    <span>Go Dashboard</span>

                </a>


                <!-- Go Back -->

                <button
                    type="button"
                    class="stackly-404-button stackly-404-back"
                    id="stackly404BackButton"
                >

                    <i
                        class="fa-solid fa-arrow-left"
                        aria-hidden="true"
                    ></i>

                    <span>Go Back</span>

                </button>

            </div>


            <!-- Bakery Message -->

            <div class="stackly-404-message">

                <i
                    class="fa-solid fa-heart"
                    aria-hidden="true"
                ></i>

                <span>
                    Baked with love at Stackly Bakery
                </span>

            </div>


        </section>

    </main>


    <!-- =====================================================
         GO BACK JAVASCRIPT
    ====================================================== -->

    <script>

        document.addEventListener("DOMContentLoaded", function () {

            "use strict";


            const backButton =
                document.getElementById("stackly404BackButton");


            if (!backButton) {
                return;
            }


            backButton.addEventListener("click", function () {

                /*
                 * If the visitor has a previous page,
                 * return to that page.
                 */

                if (window.history.length > 1) {

                    window.history.back();

                }

                /*
                 * If there is no previous page,
                 * send the visitor to the homepage.
                 */

                else {

                    window.location.href = "index.html";

                }

            });

        });

    </script>


</body>

</html>
